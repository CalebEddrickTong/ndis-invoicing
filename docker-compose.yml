services:
  postgres:
    image: postgres:17
    container_name: ndis-postgres

    environment:
      POSTGRES_USER: ndis
      POSTGRES_PASSWORD: ndis_password
      POSTGRES_DB: ndis

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: ndis-minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data: